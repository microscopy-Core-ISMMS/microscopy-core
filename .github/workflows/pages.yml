name: Publish Quarto website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Check Python code quality
        run: |
          python -m black --check scripts
          python -m ruff check scripts
          python -m compileall -q scripts

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Check Quarto installation
        run: |
          quarto --version
          quarto check jupyter

      # Create _navbar.yml and initial generated pages.
      # This must happen before Quarto reads _navbar.yml.
      - name: Generate microscope navigation
        run: |
          python scripts/generate_microscope_pages.py

      # Execute the notebook to create laser-power plots and Excel files.
      - name: Generate microscope analysis
        run: |
          quarto render index.ipynb --execute
      

      - name: Generate PSF analysis
        run: |
          python scripts/generate_psf_plots.py

      - name: Check generated outputs
        run: |
          echo "Generated output files:"
          find outputs -maxdepth 4 -type f | sort

      # Run the page generator again after the plots exist.
      - name: Regenerate microscope pages
        run: |
          python scripts/generate_microscope_pages.py

      - name: Check generated navbar
        run: |
          echo "Generated navbar:"
          cat _navbar.yml

      - name: Check generated microscope pages
        run: |
          echo "Generated microscope pages:"
          find microscopes -type f | sort

      # Render all QMD pages recursively.
      # This includes:
      # microscopes/index.qmd
      # microscopes/laser_power/*.qmd
      # microscopes/psf/*.qmd

      - name: Render website pages
        run: |
          find microscopes image_analysis -type f -name "*.qmd" | sort | while read -r page; do
            echo "Rendering $page"
            quarto render "$page"
          done

      - name: Check microscope introduction page
        run: |
          echo "Checking microscope introduction:"
          ls -l _site/microscopes/
          echo ""
          echo "Checking for index.html:"
          ls -l _site/microscopes/index.html

      - name: Check rendered website
        run: |
          echo "Rendered website files:"
          find _site -maxdepth 5 -type f | sort

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
